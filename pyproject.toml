[project]
name = "semantic-cache"
version = "0.1.0"
description = "Production semantic cache for LLM responses — Postgres + pgvector, exact-hash + near-match lookup."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Darrshan Govender", email = "darrshangovender@gmail.com" }]
keywords = ["llm", "cache", "rag", "pgvector", "embeddings"]
dependencies = [
    "psycopg[binary]>=3.2",
    "openai>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/darrshangovender/semantic-cache"
Issues = "https://github.com/darrshangovender/semantic-cache/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semantic_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
